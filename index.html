<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#16201c">
  <meta name="description" content="Dersi sesli anlatan, görselleri tahtada gösteren ve öğrenme hedeflerini sorularla yoklayan açık kaynak çalışma aracı.">
  <title>KlinikKoç</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="stylesheet" href="css/tahta.css">
</head>
<body>
  <!-- Ders listesi -->
  <main id="home" class="screen">
    <header class="home-head">
      <h1>KlinikKoç</h1>
      <p>Dersi dinleyin, tahtayı izleyin, kendinizi yoklayın. Sorular not için değil, öğrenmek için.</p>
    </header>
    <div id="catalog" class="catalog" aria-live="polite"></div>
    <footer class="home-foot">
      <a class="home-link" href="ana.html">‹ Ana ekran</a>
      <a class="home-link" href="kilavuz.html">Kullanım kılavuzu</a>
      <a class="home-link" href="sablon-galerisi.html">Çizim şablonları</a>
      <a class="home-link" href="makaleler.html">Ders paketleri ve makaleler</a>
      <a class="home-link" href="sihirbaz.html">Öğretmen: ders hazırlama sihirbazı</a>
      <span>Açık kaynak · kâr amacı gütmez · çevrimdışı çalışır · <span id="surum"></span></span>
    </footer>
  </main>

  <!-- Ders ekranı -->
  <section id="lesson" class="screen" hidden>
    <header class="topbar">
      <button class="icon-btn" data-act="home" aria-label="Ders listesine dön" title="Ders listesi">
        <svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg>
      </button>
      <div class="topbar-titles">
        <div class="lesson-name"></div>
        <div class="section-name"></div>
      </div>
      <button class="icon-btn qa-btn" data-act="qa" aria-label="Soru sor" title="Soru sor">
        <svg viewBox="0 0 24 24"><path d="M4 5h16v11H9l-5 4z"/></svg>
      </button>
      <button class="btn small case-return" id="caseReturn" data-act="case-return" hidden>Vakaya dön</button>
      <button class="icon-btn cases-btn" data-act="cases" aria-label="Vakalar" title="Vakalar" hidden>
        <svg viewBox="0 0 24 24"><path d="M9 4h6v3H9zM5 7h14v13H5zM12 11v6M9 14h6"/></svg>
      </button>
      <button class="icon-btn" data-act="toc" aria-label="İçindekiler" title="İçindekiler">
        <svg viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h10"/></svg>
      </button>
      <button class="icon-btn" data-act="goals" aria-label="Öğrenme hedefleri" title="Öğrenme hedefleri">
        <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8"/><circle cx="12" cy="12" r="4"/><circle cx="12" cy="12" r="0.5"/></svg>
      </button>
      <button class="icon-btn" data-act="settings" aria-label="Ayarlar" title="Ayarlar">
        <svg viewBox="0 0 24 24"><path d="M4 7h10M18 7h2M4 17h4M12 17h8"/><circle cx="16" cy="7" r="2"/><circle cx="10" cy="17" r="2"/></svg>
      </button>
      <button class="icon-btn" data-act="fullscreen" aria-label="Tam ekran" title="Tam ekran">
        <svg viewBox="0 0 24 24"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg>
      </button>
    </header>

    <div class="board" id="board" data-layout="notes">
      <div class="board-source" hidden></div>
      <div class="board-title"></div>
      <div class="board-body">
        <div class="board-visual"></div>
        <div class="board-notes"></div>
      </div>
      <div class="question" id="question" hidden></div>
    </div>

    <div class="caption" id="caption" aria-live="polite"></div>

    <footer class="controls">
      <button class="ctrl-btn" data-act="prev" aria-label="Önceki adım">
        <svg viewBox="0 0 24 24"><path d="M6 5v14M19 5l-10 7 10 7z"/></svg>
      </button>
      <button class="ctrl-btn" data-act="replay" aria-label="Cümleyi tekrarla" title="Cümleyi tekrarla (R)">
        <svg viewBox="0 0 24 24"><path d="M4 12a8 8 0 1 0 2.5-5.8M4 4v5h5"/></svg>
      </button>
      <button class="ctrl-btn play" data-act="play" aria-label="Oynat">
        <svg class="i-play" viewBox="0 0 24 24"><path d="M7 4l13 8-13 8z"/></svg>
        <svg class="i-pause" viewBox="0 0 24 24"><path d="M7 4v16M17 4v16"/></svg>
      </button>
      <button class="ctrl-btn" data-act="next" aria-label="Sonraki adım">
        <svg viewBox="0 0 24 24"><path d="M18 5v14M5 5l10 7-10 7z"/></svg>
      </button>
      <div class="track" id="track" role="slider" aria-label="Ders ilerlemesi" tabindex="0">
        <div class="track-sections"></div>
        <div class="track-fill"></div>
      </div>
      <div class="step-count" id="stepCount"></div>
      <button class="ctrl-btn speed" data-act="speed" aria-label="Anlatım hızı" title="Anlatım hızı">1,0×</button>
    </footer>

    <aside class="drawer" id="drawer" hidden>
      <div class="drawer-head">
        <h2></h2>
        <button class="icon-btn" data-act="close-drawer" aria-label="Kapat">
          <svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg>
        </button>
      </div>
      <div class="drawer-body"></div>
    </aside>
  </section>

  <div class="toast" id="toast" role="status" hidden></div>

  <script src="config.js"></script>
  <script src="js/core.js"></script>
  <script src="js/speech.js"></script>
  <script src="js/anatomi.js"></script>
  <script src="js/anatomi-bolge.js"></script>
  <script src="js/board.js"></script>
  <script src="js/player.js"></script>
  <script src="js/karne.js"></script>
  <script src="js/vaka.js"></script>
  <script src="js/sozlu.js"></script>
  <script src="js/qa/qa.js"></script>
  <script src="js/qa/bilgi.js"></script>
  <script src="js/qa/saglayici-anthropic.js"></script>
  <script src="js/qa/saglayici-ollama.js"></script>
  <script src="js/qa/saglayici-openai.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
